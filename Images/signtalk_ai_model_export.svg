<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="460" fill="#0b0f15"/>
  <rect x="22" y="20" width="1156" height="420" rx="28" fill="#f8fafc"/>

  <!-- Header -->
  <text x="70" y="63" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2" fill="#64748b">SIGNTALK AI  /  MODEL PIPELINE</text>
  <text x="70" y="99" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">VSL-30 V4.3 model export</text>
  <text x="70" y="123" font-family="Arial, sans-serif" font-size="15" fill="#64748b">From training notebook to on-device inference on Arduino UNO Q</text>

  <!-- Connectors sit in their own lane -->
  <line x1="337" y1="226" x2="448" y2="226" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="737" y1="226" x2="848" y2="226" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="366" y="199" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#64748b">EXPORT</text>
  <text x="762" y="199" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#64748b">DEPLOY</text>

  <!-- Training -->
  <rect x="70" y="157" width="267" height="138" rx="18" fill="#f1edff" stroke="#8b5cf6" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="99" cy="188" r="15" fill="#8b5cf6"/>
  <text x="99" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">01</text>
  <text x="125" y="193" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.3" fill="#6d28d9">TRAIN</text>
  <text x="96" y="235" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#312e81">Notebook</text>
  <text x="96" y="264" font-family="Arial, sans-serif" font-size="16" fill="#5b21b6">train  •  evaluate  •  export</text>

  <!-- ONNX -->
  <rect x="448" y="157" width="289" height="138" rx="18" fill="#eaf3ff" stroke="#60a5fa" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="477" cy="188" r="15" fill="#3b82f6"/>
  <text x="477" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">02</text>
  <text x="503" y="193" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.3" fill="#2563eb">EXPORT</text>
  <text x="474" y="235" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">ONNX</text>
  <text x="474" y="264" font-family="Arial, sans-serif" font-size="16" fill="#1d4ed8">[1, 48, 75, 4]  •  30-class logits</text>

  <!-- Edge deployment -->
  <rect x="848" y="157" width="282" height="138" rx="18" fill="#eafaf0" stroke="#22c55e" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="877" cy="188" r="15" fill="#16a34a"/>
  <text x="877" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">03</text>
  <text x="903" y="193" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.3" fill="#15803d">DEPLOY</text>
  <text x="874" y="235" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#14532d">UNO Q</text>
  <text x="874" y="264" font-family="Arial, sans-serif" font-size="16" fill="#166534">vsl30_v4_3  •  Edge AI</text>

  <!-- Artifacts -->
  <rect x="70" y="337" width="1060" height="62" rx="16" fill="#eef2f7" stroke="#d8e0ea" stroke-width="1.5"/>
  <text x="94" y="363" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#64748b">REQUIRED ARTIFACTS</text>
  <text x="94" y="384" font-family="Consolas, monospace" font-size="14" fill="#334155">vsl30_v4_3_main.onnx  •  label_map.json  •  deployment_config.json</text>
</svg>
