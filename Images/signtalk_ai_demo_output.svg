  <rect x="784" y="419" width="312" height="12" rx="6" fill="#e6eee9"/>
  <rect x="784" y="419" width="306" height="12" rx="6" fill="#4caf70"/>
  <rect x="784" y="450" width="158" height="28" rx="14" fill="#e1f7e8"/>
