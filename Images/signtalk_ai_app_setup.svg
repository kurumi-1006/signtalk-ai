<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="450" fill="#0b0f15"/>
  <rect x="22" y="20" width="1156" height="410" rx="28" fill="#f8fafc"/>

  <text x="70" y="62" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2" fill="#64748b">SETUP  /  VIETNAMESE SIGN-LANGUAGE RECOGNITION</text>
  <text x="70" y="99" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Prepare SignTalk AI</text>
  <text x="70" y="123" font-family="Arial, sans-serif" font-size="15" fill="#64748b">Connect the camera UI to the VSL-30 Edge AI service on Arduino UNO Q</text>

  <!-- Connector lane -->
  <line x1="342" y1="223" x2="451" y2="223" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="737" y1="223" x2="846" y2="223" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="396" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#64748b">CONFIGURE</text>
  <text x="792" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#64748b">PREDICT</text>

  <!-- Endpoint configuration -->
  <rect x="70" y="157" width="272" height="135" rx="18" fill="#fff7df" stroke="#f59e0b" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="99" cy="188" r="15" fill="#f59e0b"/>
  <text x="99" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">01</text>
  <text x="125" y="193" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.3" fill="#b45309">CONFIG</text>
  <text x="96" y="235" font-family="Consolas, monospace" font-size="23" font-weight="700" fill="#78350f">.env</text>
  <text x="96" y="264" font-family="Consolas, monospace" font-size="15" fill="#92400e">UNO_Q_IP:8082</text>

  <!-- Frontend -->
  <rect x="451" y="157" width="286" height="135" rx="18" fill="#f1edff" stroke="#8b5cf6" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="480" cy="188" r="15" fill="#8b5cf6"/>
  <text x="480" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">02</text>
  <text x="506" y="193" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.3" fill="#6d28d9">FRONTEND</text>
  <text x="477" y="235" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#4c1d95">Expo app</text>
  <text x="477" y="264" font-family="Arial, sans-serif" font-size="15" fill="#5b21b6">camera  •  upload  •  VSL gloss UI</text>

  <!-- Edge AI -->
  <rect x="846" y="157" width="284" height="135" rx="18" fill="#eafaf0" stroke="#22c55e" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="875" cy="188" r="15" fill="#16a34a"/>
  <text x="875" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">03</text>
  <text x="901" y="193" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.3" fill="#15803d">EDGE AI</text>
  <text x="872" y="235" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#14532d">/predict</text>
  <text x="872" y="264" font-family="Arial, sans-serif" font-size="15" fill="#166534">FastAPI  •  VSL-30  •  :8082</text>

  <rect x="70" y="337" width="1060" height="50" rx="16" fill="#eef2f7" stroke="#d8e0ea" stroke-width="1.5"/>
  <text x="94" y="368" font-family="Arial, sans-serif" font-size="16" fill="#334155">Configure  →  run frontend  →  verify /health  →  start Vietnamese sign recognition</text>
</svg>
