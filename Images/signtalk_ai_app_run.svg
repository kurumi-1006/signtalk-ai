<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="460" fill="#0b0f15"/>
  <rect x="22" y="20" width="1156" height="420" rx="28" fill="#f8fafc"/>

  <text x="70" y="62" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2" fill="#64748b">RUN  /  EDGE AI INFERENCE</text>
  <text x="70" y="99" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Run Vietnamese sign recognition</text>
  <text x="70" y="123" font-family="Arial, sans-serif" font-size="15" fill="#64748b">Launch the VSL-30 service, then open the camera frontend and start recognition</text>

  <!-- App Lab terminal -->
  <rect x="70" y="157" width="700" height="190" rx="18" fill="#16251f" filter="url(#shadow)"/>
  <rect x="70" y="157" width="700" height="48" rx="18" fill="#1f342b"/>
  <circle cx="102" cy="181" r="8" fill="#ef4444"/><circle cx="128" cy="181" r="8" fill="#f59e0b"/><circle cx="154" cy="181" r="8" fill="#22c55e"/>
  <text x="188" y="187" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#d8e8df">Arduino App Lab  /  SignTalk AI</text>
  <text x="104" y="240" font-family="Consolas, monospace" font-size="18" fill="#a9c1b3">$ start signtalk-ai-stack</text>
  <text x="104" y="273" font-family="Consolas, monospace" font-size="18" fill="#9ee6b2">✓ Brick started successfully</text>
  <text x="104" y="306" font-family="Consolas, monospace" font-size="18" fill="#9ee6b2">✓ VSL-30 V4.3 loaded  •  30 classes</text>
  <text x="104" y="334" font-family="Consolas, monospace" font-size="18" fill="#9ee6b2">✓ Edge AI listening on :8082</text>

  <!-- Ready panel -->
  <rect x="800" y="157" width="330" height="190" rx="18" fill="#eafaf0" stroke="#22c55e" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="838" cy="198" r="10" fill="#16a34a"/>
  <text x="862" y="204" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2" fill="#15803d">READY TO RECOGNIZE</text>
  <text x="834" y="250" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#14532d">Vietnamese sign language</text>
  <text x="834" y="279" font-family="Arial, sans-serif" font-size="15" fill="#166534">Camera  →  landmarks  →  gloss</text>
  <rect x="834" y="303" width="224" height="28" rx="14" fill="#c9f0d5"/>
  <text x="946" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#17653a">/predict  •  ONLINE</text>

  <rect x="70" y="374" width="1060" height="42" rx="14" fill="#eef2f7" stroke="#d8e0ea" stroke-width="1.5"/>
  <text x="94" y="401" font-family="Arial, sans-serif" font-size="16" fill="#334155">Press Run  →  open frontend  →  enable camera  →  start recognition</text>
</svg>
