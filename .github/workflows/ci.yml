name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm prisma validate --schema database/prisma/schema.prisma
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -e 'services/edge-ai[dev]'
      - run: cd services/edge-ai && ruff check . && mypy src && pytest
