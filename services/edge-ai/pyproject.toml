[project]
name = "signtalk-ai-edge-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "mediapipe>=0.10.18,<0.10.19", "numpy>=1.26,<2", "onnxruntime>=1.20", "protobuf>=4.25.3,<5", "pydantic-settings>=2.0", "python-multipart>=0.0.20", "uvicorn>=0.34"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.0"]
[tool.ruff]
line-length = 100
[tool.mypy]
python_version = "3.11"
strict = true
[tool.pytest.ini_options]
pythonpath = ["."]
